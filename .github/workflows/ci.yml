name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install 'python-docx==1.1.0' 'python-pptx==1.0.2' Pillow

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install OS build deps (libvips, libsqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev libsqlite3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          JWT_SECRET: ci_secret_at_least_32_chars_long_xxxxxx
        run: npm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag gharsetu:ci \
            --load \
            .

      - name: Run container & probe /api/healthz
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name gharsetu-ci \
            -p 8080:8080 \
            -e JWT_SECRET=ci_secret_at_least_32_chars_long_xxxxxx \
            -e NODE_ENV=production \
            -e SEED_ON_START=1 \
            -e DB_PATH=/tmp/gharsetu.db \
            -e UPLOADS_DIR=/tmp/uploads \
            -e COOKIE_SECURE=0 \
            gharsetu:ci

          deadline=$((SECONDS + 60))
          ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsS http://localhost:8080/api/healthz || true)
            if echo "$body" | grep -q '"ok":true'; then
              ok=1
              echo "healthz body: $body"
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::/api/healthz did not return ok=true within 60s"
            docker logs gharsetu-ci || true
            docker stop gharsetu-ci || true
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker stop gharsetu-ci || true

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
