name: Markdown link check

on:
  pull_request:
    paths: ['**/*.md']
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: .github/markdown-link-check-config.json
          use-quiet-mode: 'yes'
