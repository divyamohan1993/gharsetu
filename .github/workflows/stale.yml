name: Stale

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further
            activity occurs. Add a comment or remove the `stale` label to keep
            it open.
          close-issue-message: >
            Closing this issue due to inactivity. Please reopen if it is still
            relevant — we are happy to revisit.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed in 14 days if no
            further activity occurs.
          close-pr-message: >
            Closing this pull request due to inactivity. Please reopen if you
            would like to continue this work.
          exempt-issue-labels: "pinned,security,roadmap,good first issue"
          exempt-pr-labels: "pinned,security,roadmap,good first issue"
          remove-stale-when-updated: true
          operations-per-run: 100
