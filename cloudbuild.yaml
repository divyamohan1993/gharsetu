steps:
  # 1. Build the container image (tag with commit SHA + latest)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=org.opencontainers.image.source=$REPO_NAME
      - .

  # 2. Push the SHA-tagged image
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
    waitFor: ["build"]

  # 3. Push the :latest tag
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
    waitFor: ["build"]

  # 4. Deploy to Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --port=8080
      - --set-env-vars=NODE_ENV=production,LOG_LEVEL=info,SEED_ON_START=1,DB_PATH=/tmp/gharsetu.db,UPLOADS_DIR=/tmp/uploads,COOKIE_SECURE=1
      - --set-secrets=JWT_SECRET=jwt-secret:latest,RZP_KEY_SECRET=rzp-secret:latest,RZP_WEBHOOK_SECRET=rzp-webhook-secret:latest,DIGILOCKER_CLIENT_SECRET=digilocker-secret:latest,ADMIN_PASSWORD=admin-password:latest
    waitFor: ["push-sha", "push-latest"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

substitutions:
  _REGION: asia-south1
  _REPO: gharsetu-images
  _SERVICE: gharsetu

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

