<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're offline · GharSetu</title>
<meta name="theme-color" content="#E26A2C">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", Roboto, Arial, sans-serif;
    background: #FFFCF7; color: #14110E;
    padding: 1rem; line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0E0C0A; color: #F7F1E6; }
  }
  main {
    max-width: 32rem; text-align: center;
  }
  .mark {
    display: inline-grid; place-items: center;
    width: 64px; height: 64px;
    border-radius: 12px;
    background: #FFE9D9; color: #8A2E00;
    border: 2px solid #C44A12;
    font-weight: 800; font-size: 1.75rem;
    margin-bottom: 1rem;
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
  p { margin: 0.5rem 0; }
  a {
    display: inline-block; margin-top: 1.5rem;
    padding: 0.75rem 1.5rem;
    background: #8A2E00; color: #FFFFFF;
    text-decoration: none; border-radius: 8px;
    font-weight: 600; min-height: 44px;
  }
  a:hover { background: #C44A12; color: #1A1A1A; }
  .muted { color: #4A453E; }
  @media (prefers-color-scheme: dark) { .muted { color: #C5BCAC; } a { background: #FFB07A; color: #1A1A1A; } }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">घ</div>
    <h1>You're offline</h1>
    <p>GharSetu can't reach the network right now.</p>
    <p class="muted">Check your connection and try again. Saved pages still work.</p>
    <a href="/">Try home</a>
  </main>
</body>
</html>
